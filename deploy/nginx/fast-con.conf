# =============================================================================
# FastCons — full nginx reverse proxy
# =============================================================================
#
# App facts:
#   - Next.js basePath: /cs116.khtn  (see apps/web/next.config.mjs)
#   - Browser → nginx → Next.js :3000 → middleware rewrite → FastAPI :8010
#   - FastAPI must stay on 127.0.0.1 only; do not proxy :8010 from the internet.
#
# Before use:
#   1. Replace SERVER_NAME (e.g. contest.example.edu.vn)
#   2. Replace SSL certificate paths (or use certbot)
#   3. Ensure ./start-application.sh (or systemd) runs Next :3000 + API :8010
#   4. apps/web/.env.local → FASTAPI_INTERNAL_URL="http://127.0.0.1:8010"
#   5. NODE_ENV=production when running `next start` (session cookie secure flag)
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/nginx/fast-con.conf /etc/nginx/sites-available/fast-con.conf
#   sudo ln -sf /etc/nginx/sites-available/fast-con.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Local HTTP-only test: use the alternate server block at the bottom instead of
# the listen 80 redirect + listen 443 blocks.
# =============================================================================

upstream fastcon_nextjs {
    server 127.0.0.1:3000;
    keepalive 32;
}

# No upload size limit (nginx default is 1m; 0 disables the check)
client_max_body_size 0;

# -----------------------------------------------------------------------------
# HTTP → HTTPS redirect
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (production)
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVER_NAME;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:FastConSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 301 /cs116.khtn/;
    }

    # --- SSE: live submission updates ---
    location = /cs116.khtn/api/submissions/stream {
        proxy_pass http://fastcon_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- SSE: live leaderboard (optional ?contestId=...) ---
    location ~ ^/cs116\.khtn/api/leaderboard/stream {
        proxy_pass http://fastcon_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # --- Pages + Next API + POST /api/submissions (rewritten to FastAPI by Next) ---
    location /cs116.khtn/ {
        proxy_pass http://fastcon_nextjs/cs116.khtn/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

