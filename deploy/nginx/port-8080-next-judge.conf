# Port 8080 routing:
# - /                -> Next.js frontend
# - /api             -> Next.js API routes
# - /judge-service   -> FastAPI judge service
#
# Assumptions:
# - Next.js listens on 127.0.0.1:3000
# - FastAPI listens on 127.0.0.1:8010
# - Browser-facing FastAPI base URL should be NEXT_PUBLIC_FASTAPI_PUBLIC_URL="/judge-service"

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 1g;

    # FastAPI large submission uploads.
    # Keep /api in the upstream path because FastAPI routes are /api/submissions/*.
    location ^~ /judge-service/api/submissions/ {
        client_max_body_size 1g;
        client_body_timeout 600s;

        rewrite ^/judge-service(/api/submissions/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;
    }

    # FastAPI judge service.
    location ^~ /judge-service/ {
        rewrite ^/judge-service/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location = /judge-service {
        return 302 /judge-service/;
    }

    # Next.js API routes.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;
    }

    location = /api {
        return 302 /api/;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Ssl on;
    }
}
