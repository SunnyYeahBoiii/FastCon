# Place inside the server {} block. Keep this order:
# 1. /socket.io/
# 2. /api/submissions/ upload paths
# 3. generic /api/
# 4. frontend /

# Allow request bodies up to 1GB in this server block.
client_max_body_size 1g;

# Socket.io WebSocket.
location /socket.io/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Ssl on;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Large submission uploads.
# These must appear before the generic /api/ location.
location ^~ /api/submissions/ {
    client_max_body_size 1g;
    client_body_timeout 600s;

    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    # Stream request body to upstream immediately instead of buffering the full file.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Ssl on;
}

# Same upload path when the app is served under the /cs116.khtn base path.
location ^~ /cs116.khtn/api/submissions/ {
    client_max_body_size 1g;
    client_body_timeout 600s;

    # Strip only the deployment base path. Keep /api because FastAPI routes include it.
    rewrite ^/cs116\.khtn(/api/submissions/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_request_buffering off;
    proxy_buffering off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Ssl on;
}

# API: keep /api canonical, then strip /api/ before forwarding.
location = /api {
    return 302 /api/;
}

location /api/ {
    rewrite ^/api/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;

    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Ssl on;
}

# Next.js frontend.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Ssl on;
}
